spring.application.name=sistema-gestao
server.port=${GESTAO_PORT:8080}
spring.datasource.url=${GESTAO_DB_URL:jdbc:sqlite:data/gestao.db?busy_timeout=10000}
spring.datasource.driver-class-name=org.sqlite.JDBC
spring.datasource.hikari.connection-init-sql=PRAGMA foreign_keys=ON
spring.datasource.hikari.connection-timeout=10000
spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
logging.level.org.hibernate.SQL=warn
